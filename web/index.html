<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
/*{{CSS}}*/
</style>
</head>
<body>
<canvas id="map" aria-label="Map of the repository"></canvas>
<div id="tree" aria-label="The repository as a tree"><div id="treeWorld"><svg id="treeEdges"></svg><svg id="treeCalls"></svg><div id="treeNodes"></div></div></div>
<div id="planes" aria-label="The repository in 3D, one plane per level"></div>
<main id="page"></main>
<div id="tip" hidden></div>

<header id="bar" class="panel">
  <div class="brand"><b id="repoName"></b><span id="repoMeta"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Find a file or function" autocomplete="off" spellcheck="false" aria-label="Find a file or function">
    <div id="results" role="listbox" hidden></div>
  </div>
  <nav class="views" aria-label="View">
    <button data-view="start" aria-pressed="false">Start here</button>
    <button data-view="radial" aria-pressed="true">Circle</button>
    <button data-view="sunburst" aria-pressed="false">Rings</button>
    <button data-view="tree" aria-pressed="false">Tree</button>
    <button data-view="planes" aria-pressed="false">3D</button>
  </nav>
  <button id="keyBtn" class="keybtn" aria-expanded="false" aria-controls="key">Key</button>
</header>

<aside id="side" class="panel" hidden>
  <div class="grip" id="sideGrip" title="Drag to resize" aria-hidden="true"></div>
  <div class="side-head">
    <div class="trail" id="sideTrail"></div>
    <button class="x" id="sideClose" aria-label="Close">×</button>
  </div>
  <div id="sideBody"></div>
</aside>

<nav id="crumbs" class="panel" aria-label="Where you are"></nav>
<div id="zoombar" class="panel" role="group" aria-label="Zoom">
  <button data-zoom="in" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <button data-zoom="out" aria-label="Zoom out" title="Zoom out (−)">−</button>
  <button data-zoom="fit" title="Fit the circle (0)">Fit</button>
  <button data-zoom="up" title="Out one level (Backspace)">↑ Out</button>
</div>
<section id="key" class="panel" hidden aria-label="Key"></section>

<!--{{DATA}}-->
<!--{{LIBS}}-->
<script>
/*{{JS}}*/
</script>
</body>
</html>
